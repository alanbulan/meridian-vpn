name: Native build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.target }} / build and unit tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-amd64
            ext: ''
          - runner: windows-2022
            target: windows-amd64
            ext: '.exe'
          - runner: macos-15
            target: darwin-arm64
            ext: ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test offline CI reporting and artifact verification
        run: python3 -m unittest discover -s scripts -v
      - name: Verify toolchain and module integrity
        run: |
          go version
          go env GOOS GOARCH
          go mod download
          go mod verify
          go mod tidy -diff
      - name: Unit tests (not live VPN acceptance)
        run: |
          mkdir -p reports
          set -o pipefail
          go test -count=1 -json ./... | tee reports/tests.jsonl
      - name: Static analysis
        run: go vet ./...
      - name: Native GUI and CLI build
        run: |
          mkdir -p build
          go build -buildvcs=false -trimpath -tags mygo_noinspector -ldflags '-s -w -X github.com/egoist/mygo.production=1' -o build/meridian${{ matrix.ext }} ./cmd/meridian
          go build -buildvcs=false -trimpath -ldflags '-s -w' -o build/meridianctl${{ matrix.ext }} ./cmd/meridianctl
      - name: Run native CLI without configuration or network changes
        run: |
          ./build/meridianctl${{ matrix.ext }} version
          ./build/meridianctl${{ matrix.ext }} help
      - name: Verify binary targets and write checksums
        run: python3 scripts/build-manifest.py build ${{ matrix.target }}
      - name: Write honest test summary
        if: always()
        run: python3 scripts/ci-summary.py reports/tests.jsonl
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tests-${{ matrix.target }}
          path: reports/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload unsigned development binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: meridian-dev-${{ matrix.target }}
          path: build/
          if-no-files-found: error
          retention-days: 7

  linux-security:
    name: Linux / race and offline security regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Race detector (CGO is test instrumentation only)
        env:
          CGO_ENABLED: '1'
        run: go test -race -count=1 ./...
      - name: Bootstrap static build and injected tests only
        run: make -C integration/worker-bootstrap all test
      - name: Offline provisioning tests (no install or activation)
        run: python3 -m unittest discover -s integration/provisioning -v

  linux-loopback:
    name: Linux / ${{ matrix.suite }} localhost fixtures
    runs-on: ubuntu-24.04
    container: debian:trixie-slim
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [auth, native]
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Install official CI build dependencies (no VPN activation)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git python3 build-essential pkg-config \
            libopenconnect-dev openconnect openssl autoconf automake \
            libtool libtool-bin gettext libssl-dev libxml2-dev zlib1g-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Prepare unprivileged fixture user and dependency evidence
        run: |
          useradd --create-home --shell /bin/bash meridian-ci
          mkdir -p reports/loopback-${{ matrix.suite }}
          dpkg-query -W > reports/loopback-${{ matrix.suite }}/packages.txt
          go version > reports/loopback-${{ matrix.suite }}/go-version.txt
          chown -R meridian-ci:meridian-ci "$GITHUB_WORKSPACE"
      - name: Test fixture runner evidence checks
        run: python3 -m unittest discover -s integration/loopback -v
      - name: Run unprivileged synthetic authentication fixtures
        if: matrix.suite == 'auth'
        run: |
          runuser -u meridian-ci -- env PATH="$PATH" GOTOOLCHAIN=local \
            GOPATH=/home/meridian-ci/go GOCACHE=/home/meridian-ci/.cache/go-build \
            MERIDIAN_OPENCONNECT_TEST_BINARY="$(command -v openconnect)" \
            MERIDIAN_MFA_HELPER_TEST_BINARY="$GITHUB_WORKSPACE/build/meridian-auth-helper" \
            bash -e -c '
              sh integration/mfa-helper/build.sh "$PWD/build/meridian-auth-helper"
              python3 integration/loopback/run.py auth --reports reports/loopback-auth
            '
      - name: Run unprivileged native loopback and syscall-wrapped fixtures
        if: matrix.suite == 'native'
        run: |
          runuser -u meridian-ci -- env PATH="$PATH" GOTOOLCHAIN=local \
            python3 integration/loopback/run.py native --reports reports/loopback-native \
              --native-build "$GITHUB_WORKSPACE/build/loopback-native"
      - name: Upload localhost-only fixture evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: loopback-${{ matrix.suite }}-evidence
          path: reports/loopback-${{ matrix.suite }}/
          if-no-files-found: warn
          retention-days: 7

  credential-wire:
    name: Linux / isolated Secret Service wire fixtures
    runs-on: ubuntu-24.04
    container: debian:trixie-slim
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Install official disposable fixture dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git dbus-daemon python3 procps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Run synthetic private-bus fixtures as isolated user
        run: |
          useradd --create-home --shell /bin/bash meridian-wire-ci
          chown -R meridian-wire-ci:meridian-wire-ci "$GITHUB_WORKSPACE"
          runuser -u meridian-wire-ci -- env PATH="$PATH" GOTOOLCHAIN=local \
            GOPATH=/home/meridian-wire-ci/go GOCACHE=/home/meridian-wire-ci/.cache/go-build \
            bash integration/credentialstore/run-wire-tests.sh
      - name: Verify all wire cases actually passed
        run: |
          python3 scripts/ci-summary.py reports/credential-wire/tests.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows = [json.loads(line) for line in Path('reports/credential-wire/tests.jsonl').read_text().splitlines()]
          expected = {'TestCredentialWireLifecycleAndStates', 'TestCredentialWireDuplicateAndUnknownObject', 'TestCredentialWireCancellation', 'TestCredentialWireOwnerReplacement'}
          passed = {r.get('Test') for r in rows if r.get('Action') == 'pass'}
          assert expected <= passed, 'missing passing wire cases'
          assert not any(r.get('Action') in ('skip', 'fail') for r in rows), 'wire case skipped or failed'
          PY
      - name: Clean only this disposable fixture user after timeout or failure
        if: always()
        run: |
          if id meridian-wire-ci >/dev/null 2>&1; then
            uid="$(id -u meridian-wire-ci)"
            # This UID is created for this job only, never a host/login user.
            pkill -KILL -u "$uid" || test "$?" -eq 1
            find /tmp -maxdepth 1 -type d -uid "$uid" -name 'meridian-secret-wire-*' -exec rm -rf -- {} +
          fi
          # Runner teardown destroys this entire container if the job is killed.
      - name: Upload synthetic wire test evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: credential-wire-evidence
          path: reports/credential-wire/
          if-no-files-found: warn
          retention-days: 7

  credential-gnome:
    name: Linux / isolated GNOME Keyring lifecycle
    runs-on: ubuntu-24.04
    container: debian:trixie-slim
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Install official disposable fixture dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git dbus-daemon gnome-keyring python3 procps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Run synthetic private-bus fixtures as isolated user
        run: |
          useradd --create-home --shell /bin/bash meridian-gnome-ci
          chown -R meridian-gnome-ci:meridian-gnome-ci "$GITHUB_WORKSPACE"
          runuser -u meridian-gnome-ci -- env PATH="$PATH" GOTOOLCHAIN=local \
            GITHUB_ACTIONS=true MERIDIAN_GNOME_CONTAINER_TESTS=1 \
            GOPATH=/home/meridian-gnome-ci/go GOCACHE=/home/meridian-gnome-ci/.cache/go-build \
            bash integration/credentialstore/run-gnome-tests.sh
      - name: Verify real provider case actually passed
        run: |
          python3 scripts/ci-summary.py reports/credential-gnome/tests.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows = [json.loads(line) for line in Path('reports/credential-gnome/tests.jsonl').read_text().splitlines()]
          expected = {'TestCredentialGNOMERealLifecycle'}
          passed = {r.get('Test') for r in rows if r.get('Action') == 'pass'}
          assert expected <= passed, 'missing passing real provider case'
          assert not any(r.get('Action') in ('skip', 'fail') for r in rows), 'real provider case skipped or failed'
          PY
      - name: Clean only this disposable fixture user after timeout or failure
        if: always()
        run: |
          if id meridian-gnome-ci >/dev/null 2>&1; then
            uid="$(id -u meridian-gnome-ci)"
            # This UID is created for this job only, never a host/login user.
            pkill -KILL -u "$uid" || test "$?" -eq 1
            find /tmp -maxdepth 1 -type d -uid "$uid" \( -name 'meridian-secret-wire-*' -o -name 'meridian-gnome-*' \) -exec rm -rf -- {} +
          fi
          # Runner teardown destroys this entire container if the job is killed.
      - name: Upload synthetic wire test evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: credential-gnome-evidence
          path: reports/credential-gnome/
          if-no-files-found: warn
          retention-days: 7

  credential-production:
    name: Linux / isolated production Secret Service entry
    runs-on: ubuntu-24.04
    container: debian:trixie-slim
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Install official disposable fixture dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git dbus-daemon gnome-keyring python3 procps util-linux coreutils libc-bin
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Run synthetic private-bus fixtures as isolated user
        run: |
          useradd --create-home --shell /bin/bash meridian-production-ci
          chown -R meridian-production-ci:meridian-production-ci "$GITHUB_WORKSPACE"
          mkdir -p reports/credential-production
          set -o pipefail
          GITHUB_ACTIONS=true MERIDIAN_PRODUCTION_CONTAINER_TESTS=1 \
            bash integration/credentialstore/run-production-tests.sh meridian-production-ci \
            | tee reports/credential-production/tests.jsonl
      - name: Verify real provider case actually passed
        run: |
          python3 scripts/ci-summary.py reports/credential-production/tests.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows = [json.loads(line) for line in Path('reports/credential-production/tests.jsonl').read_text().splitlines()]
          expected = {'TestCredentialProductionEntry'}
          passed = {r.get('Test') for r in rows if r.get('Action') == 'pass'}
          assert expected <= passed, 'missing passing real provider case'
          assert not any(r.get('Action') in ('skip', 'fail') for r in rows), 'real provider case skipped or failed'
          PY
      - name: Clean only this disposable fixture user after timeout or failure
        if: always()
        run: |
          if id meridian-production-ci >/dev/null 2>&1; then
            uid="$(id -u meridian-production-ci)"
            # This UID is created for this job only, never a host/login user.
            pkill -KILL -u "$uid" || test "$?" -eq 1
            find /tmp -maxdepth 1 -type d -uid "$uid" \( -name 'meridian-secret-wire-*' -o -name 'meridian-gnome-*' \) -exec rm -rf -- {} +
          fi
          # Never recursively delete /run/user: bootstrap owns inode-checked rmdir only.
          # Runner teardown destroys this entire container if the job is killed.
      - name: Upload synthetic wire test evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: credential-production-evidence
          path: reports/credential-production/
          if-no-files-found: warn
          retention-days: 7
