name: 将 Linux 发布说明改为中文
on:
  push:
    branches: [candidate/linux-minimal-20261104]
    paths: [.github/workflows/localize-linux-release.yml, scripts/localize-linux-release.py, docs/releases/v0.1.0-alpha.1.zh-CN.md]
permissions:
  contents: read
concurrency:
  group: localize-linux-v0.1.0-alpha.1
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'alanbulan/meridian-vpn' && github.ref == 'refs/heads/candidate/linux-minimal-20261104'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: 仅更新现有发布标题和说明
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/localize-linux-release.py
