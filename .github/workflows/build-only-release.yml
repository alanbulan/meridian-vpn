name: 恢复已核对的 Linux 与 Windows 预览草稿
on:
  push:
    branches: [release/build-only-20261104]
    paths: [.github/workflows/build-only-release.yml]
permissions:
  contents: read
concurrency:
  group: meridian-build-only-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'alanbulan/meridian-vpn'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: '41856242587'
          artifact-ids: '13338415995,13338126131'
          path: build/release-inputs
          merge-multiple: false
      - name: 仅发布已有两平台产物，不构建、不测试、不执行安装器
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/resume-linux-windows-preview.py --artifacts build/release-inputs --version 0.1.0-alpha.2 --source c867b7a2200bc02eccf39a66bd73216a8e6f15bc
